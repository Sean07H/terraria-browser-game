<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Terraria — Browser Sandbox</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0d0d12;
        font-family: 'Courier New', monospace;
        -webkit-font-smoothing: none;
        image-rendering: pixelated;
      }
      #game-container {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        max-width: 100%;
        max-height: 100%;
        /* Prevent the browser from interpreting touches as scroll/zoom/select
           gestures, which would break in-game touch controls and pointer input. */
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        -webkit-user-select: none;
      }
    </style>
    <script type="module" crossorigin src="./index.CLnH5xtr.js"></script>
    <link rel="modulepreload" crossorigin href="./phaser.CaWnzXme.js">
  </head>
  <body>
    <div id="game-container"></div>
  </body>
</html>
